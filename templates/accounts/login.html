{% extends "base.html" %}

{% block title %}เข้าสู่ระบบ — เซ้งร้านด่วน.com{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-16">
    <div class="rounded-3xl border border-neutral-200/90 bg-white p-8 shadow-xl">
        <div class="text-center mb-6">
            <a href="/" class="inline-block text-2xl font-black text-neutral-900 mb-1">
                เซ้งร้านด่วน<span class="text-brand-500">.com</span>
            </a>
            <h1 class="text-xl font-bold tracking-tight text-neutral-900">เข้าสู่ระบบจัดการ</h1>
            <p class="mt-1 text-xs text-neutral-500">เข้าสู่ระบบหลังบ้านสำหรับผู้ดูแล นายหน้า และเจ้าของร้าน</p>
        </div>

        <form method="post" action="{% url 'accounts:login' %}" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-neutral-700 uppercase tracking-wider mb-1">อีเมล หรือ ชื่อผู้ใช้</label>
                <input type="text" name="username" required autocomplete="username" id="id_username"
                       class="block w-full rounded-xl border border-neutral-300 px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition"
                       placeholder="you@domain.com">
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="block text-xs font-bold text-neutral-700 uppercase tracking-wider">รหัสผ่าน</label>
                    <a href="https://line.me/R/ti/p/@shopforsale" target="_blank" rel="noopener noreferrer" class="text-[11px] text-neutral-400 hover:text-brand-600 transition">ลืมรหัสผ่าน? (ติดต่อ LINE)</a>
                </div>
                <input type="password" name="password" required autocomplete="current-password" id="id_password"
                       class="block w-full rounded-xl border border-neutral-300 px-3.5 py-2.5 text-sm shadow-sm focus:border-brand-500 focus:ring-1 focus:ring-brand-500 outline-none transition"
                       placeholder="••••••••">
            </div>

            <button type="submit"
                    class="w-full rounded-xl bg-gradient-to-r from-brand-500 to-orange-500 py-3 text-sm font-bold text-white shadow-md hover:shadow-orange-500/25 transition">
                เข้าสู่ระบบ →
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-neutral-500">
            ยังไม่มีบัญชีผู้ใช้งาน? <a href="{% url 'accounts:register' %}" class="font-bold text-brand-600 hover:underline">ลงทะเบียนฟรี</a>
        </p>
    </div>
</div>
{% endblock %}
