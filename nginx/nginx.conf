user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # WHY SECURE: Hides Nginx version from banner grabbers and fingerprinting
    server_tokens off;

    # WHY CRITICAL (Cloudflare Tunnel Real-IP):
    # Cloudflared container runs in the Docker bridge network.
    # Nginx must resolve the real client IP from Cloudflare's CF-Connecting-IP header,
    # trusted strictly from internal Docker subnets so outside attackers cannot spoof it.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   CF-Connecting-IP;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression for Performance & Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/ld+json application/javascript application/xml+rss application/atom+xml application/manifest+json image/svg+xml;

    # Rate Limiting & Concurrency Controls (Anti-DoS)
    # $binary_remote_addr now tracks real visitor IP thanks to real_ip_header above!
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    upstream django_app {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Maximum payload size (Prevents memory exhaustion attacks)
        client_max_body_size 25M;

        # Static assets (Served directly without hitting Python WSGI)
        # WHY 1y immutable: hashed/versioned static URLs are cache-busted by ?v=…, so the
        # long TTL removes a revalidation round trip from every repeat visit (a direct
        # LCP win). `expires` is intentionally NOT combined with add_header Cache-Control,
        # because nginx would then emit two conflicting Cache-Control headers.
        location /static/ {
            alias /app/staticfiles/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # WHY: the service worker and the web-app manifest MUST stay revalidatable —
        # a year-long cache on sw.js would pin visitors to a stale worker forever.
        location = /static/sw.js {
            alias /app/staticfiles/sw.js;
            add_header Cache-Control "no-cache";
        }

        location = /static/manifest.json {
            alias /app/staticfiles/manifest.json;
            add_header Cache-Control "no-cache";
        }

        # Public listing images
        # 30 days: listing photos are immutable per filename (Django re-uploads under a new
        # name), so a month of reuse is safe and cuts repeat-view payload dramatically.
        location /media/propertyimage/ {
            alias /app/media/propertyimage/;
            add_header Cache-Control "public, max-age=2592000";
        }

        # User avatars
        location /media/avatars/ {
            alias /app/media/avatars/;
            add_header Cache-Control "public, max-age=604800";
        }

        # Legacy / public media directory if used
        location /media/public/ {
            alias /app/media/public/;
            add_header Cache-Control "public, max-age=604800";
        }

        # WHY SECURE: Private Media Vault via X-Accel-Redirect
        # Direct external access returns 404. Only authorized Django responses can serve this.
        # Bank transfer slips and private contracts are strictly protected!
        location /internal-media/ {
            internal;
            alias /app/media/private/;
        }

        # Healthcheck bypass (Internal Docker / Cloudflare probes without rate-limit delay)
        location /healthz {
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Django App Proxy
        location / {
            limit_req zone=general_limit burst=30 nodelay;
            limit_conn addr_conn 20;

            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # WHY CRITICAL: Cloudflare Tunnel terminates SSL externally.
            # Enforcing https here stops Django SECURE_SSL_REDIRECT from looping!
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }

        # Strict rate limit for auth endpoints
        location /accounts/login/ {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://django_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
